services:
  - type: web
    name: grafik-pracy-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OSRM_URL
        value: https://router.project-osrm.org
      # Set this in the Render Dashboard to the pooled Neon PostgreSQL connection string.
      # sync:false keeps the secret out of Git and prevents Blueprint from replacing it.
      - key: DATABASE_URL
        sync: false
