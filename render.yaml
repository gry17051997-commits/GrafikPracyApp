services:
  - type: web
    name: grafik-pracy-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: grafik-pracy-db
          property: connectionString

databases:
  - name: grafik-pracy-db
    plan: free
    databaseName: grafik_pracy
    user: grafik_pracy
    region: frankfurt
