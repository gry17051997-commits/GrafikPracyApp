services:
  - type: web
    name: grafik-pracy-api
    runtime: node
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Set this secret manually in the Render service Environment settings.
      # It must point to the external Neon PostgreSQL database.
      - key: DATABASE_URL
        sync: false
