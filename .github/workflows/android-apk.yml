name: Android Runtime Diagnostics

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "GrafikPracy_Final/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

concurrency:
  group: grafik-pracy-runtime-diagnostics
  cancel-in-progress: true

env:
  EXPO_NO_DOCTOR: "1"
  EXPO_NO_TELEMETRY: "1"
  CI: "1"

jobs:
  runtime_test:
    name: Real app Android smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: GrafikPracy_Final

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: GrafikPracy_Final/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Run hardening tests
        run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build real debug APK
        working-directory: GrafikPracy_Final/android
        run: ./gradlew assembleDebug --no-daemon --console=plain --max-workers=2

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Start Android emulator and run real app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 4
          force-avd-creation: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          disable-animations: true
          script: |
            set +e
            adb wait-for-device
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            INSTALL_RC=$?
            adb logcat -c
            adb shell monkey -p pl.grafikpracy.app 1
            LAUNCH_RC=$?
            sleep 10
            adb shell pidof pl.grafikpracy.app > runtime-pid.txt
            adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1
            adb pull /sdcard/window.xml runtime-window.xml >/dev/null 2>&1
            adb logcat -d > runtime-logcat.txt

            echo "INSTALL_RC=$INSTALL_RC"
            echo "LAUNCH_RC=$LAUNCH_RC"
            echo "=== PROCESS ==="
            cat runtime-pid.txt 2>/dev/null
            echo "=== FATAL/ERROR LOGS ==="
            grep -E "FATAL EXCEPTION|AndroidRuntime|ReactNativeJS|Hermes|Unable to load script|Could not connect|Exception" runtime-logcat.txt | tail -200

            if [ "$INSTALL_RC" -ne 0 ] || [ "$LAUNCH_RC" -ne 0 ]; then
              exit 1
            fi

            if ! grep -q '[0-9]' runtime-pid.txt; then
              echo "Application process is not running after launch."
              exit 2
            fi

            if grep -E -q "FATAL EXCEPTION|Unable to load script|Could not connect to development server" runtime-logcat.txt; then
              echo "Fatal runtime error detected."
              exit 3
            fi

      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grafik-pracy-real-android-runtime
          path: |
            GrafikPracy_Final/android/app/build/outputs/apk/debug/app-debug.apk
            GrafikPracy_Final/runtime-logcat.txt
            GrafikPracy_Final/runtime-window.xml
            GrafikPracy_Final/runtime-pid.txt
          if-no-files-found: warn
          retention-days: 14
