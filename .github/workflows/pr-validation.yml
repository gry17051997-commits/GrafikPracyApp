name: PR Validation

# APK build retriggered for test artifact generation.

on:
  pull_request:
    branches: ['main']
    paths:
      - 'GrafikPracy_Final/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: grafik-pracy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXPO_NO_DOCTOR: "1"
  CI: "1"
  # Public central API endpoint must be embedded into the Android JS bundle.
  EXPO_PUBLIC_API_URL: "https://grafik-pracy-api-fra.onrender.com"

jobs:
  validate:
    name: Validate Web + Android + Stage 3
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: GrafikPracy_Final

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Production hardening tests
        run: npm test
      - name: Validate central API configuration
        run: node -e "const u=process.env.EXPO_PUBLIC_API_URL; if (u !== \"https://grafik-pracy-api-fra.onrender.com\") process.exit(1); console.log(\"Central API URL configured:\", u)"
      - name: Smoke test live central API and login route
        env:
          API_ORIGIN: ${{ env.EXPO_PUBLIC_API_URL }}
        run: |
          set -euo pipefail
          echo "Checking central API health (Render may need a cold start)..."
          curl --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 15 --max-time 120 --fail --silent --show-error "$API_ORIGIN/api/health" | tee /tmp/api-health.json
          node -e "const x=require('/tmp/api-health.json'); if(x.ok!==true || x.backend!=='central-api') process.exit(1); console.log('API health and database check: OK')"
          code=$(curl --retry 3 --retry-all-errors --retry-delay 10 --connect-timeout 15 --max-time 120 --silent --show-error -o /tmp/api-login-probe.json -w '%{http_code}' -H 'Content-Type: application/json' -d '{"email":"ci-invalid-user@example.invalid","password":"not-a-real-password"}' "$API_ORIGIN/api/auth/login")
          test "$code" = "401"
          node -e "const x=require('/tmp/api-login-probe.json'); if(x.error!=='INVALID_CREDENTIALS') process.exit(1); console.log('Login endpoint rejects invalid credentials correctly: OK')"
      - name: Validate project configuration
        run: npx expo config --type public
      - name: Validate build-fix scripts
        run: |
          node --check scripts/fix-app-build.js
          node --check scripts/fix-chat-build.js
          node --check scripts/fix-rotation-switch.js
      - name: Apply deterministic build fixes
        run: |
          node scripts/fix-app-build.js
          node scripts/fix-chat-build.js
          node scripts/fix-rotation-switch.js
      - name: Export web
        run: npx expo export --platform web --output-dir ci-dist
      - name: Verify web bundle
        run: |
          test -s ci-dist/index.html
          find ci-dist -type f | head -20
      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive
      - name: Verify Android native project
        run: |
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
      - name: Build release APK
        working-directory: GrafikPracy_Final/android
        run: ./gradlew assembleRelease --no-daemon --console=plain --max-workers=2
      - name: Verify APK
        working-directory: GrafikPracy_Final
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          unzip -t android/app/build/outputs/apk/release/app-release.apk >/dev/null
          ls -lh android/app/build/outputs/apk/release/app-release.apk
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Grafik-Pracy-Standard-APK
          path: GrafikPracy_Final/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

# Re-run validation for the atomic schedule persistence changes.
