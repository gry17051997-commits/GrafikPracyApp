name: PR Validation

on:
  pull_request:
    branches: ['main']
    paths:
      - 'GrafikPracy_Final/**'
      - 'GrafikPracy2/**'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: grafik-pracy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  EXPO_NO_DOCTOR: "1"
  CI: "1"

jobs:
  validate-grafik2:
    name: Grafik Pracy 2.0 baseline
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: GrafikPracy2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: GrafikPracy2/package.json
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: npm install
      - name: Core tests
        run: npm test
      - name: Expo doctor
        run: npx expo-doctor
      - name: Export web
        run: npx expo export --platform web
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive
      - name: Build debug APK
        working-directory: GrafikPracy2/android
        run: ./gradlew assembleDebug --no-daemon --console=plain --max-workers=2
      - name: Verify APK
        working-directory: GrafikPracy2
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t android/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - name: Runtime smoke test Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          script: |
            adb install -r GrafikPracy2/android/app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p pl.grafikpracy.app2 1
            sleep 12
            adb shell dumpsys activity activities | grep -E "pl.grafikpracy.app2" | head -20
            adb logcat -d -t 400 | grep -E "FATAL EXCEPTION|AndroidRuntime|pl.grafikpracy.app2" | tail -80 || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Grafik-Pracy-2-Baseline-APK
          path: GrafikPracy2/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload Web bundle
        uses: actions/upload-artifact@v4
        with:
          name: Grafik-Pracy-2-Baseline-Web
          path: GrafikPracy2/dist
          if-no-files-found: error
          retention-days: 14
