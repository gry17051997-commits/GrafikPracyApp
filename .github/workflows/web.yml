name: Deploy Web

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GrafikPracy_Final
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: GrafikPracy_Final/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Apply application build fixes
        run: node scripts/fix-app-build.js

      - name: Apply rotation switch fix
        run: node scripts/fix-rotation-switch.js

      - name: Export Expo web
        run: npx expo export --platform web

      - name: Apply smartphone web layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('dist/index.html')
          css = Path('web-mobile.css').read_text(encoding='utf-8')
          marker = '<style id="grafik-pracy-mobile">'
          if index.exists():
              html = index.read_text(encoding='utf-8')
              if marker not in html:
                  html = html.replace('</head>', marker + '\n' + css + '\n</style>\n</head>', 1)
                  index.write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: GrafikPracy_Final/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
