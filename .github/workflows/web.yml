name: Deploy Web

on:
  push:
    branches: ['main']
    paths:
      - 'GrafikPracy_Final/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GrafikPracy_Final
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: GrafikPracy_Final/package-lock.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Apply application build fixes
        run: node scripts/fix-app-build.js

      - name: Apply chat build fixes
        run: node scripts/fix-chat-build.js

      - name: Apply rotation switch fix
        run: node scripts/fix-rotation-switch.js

      - name: Export Expo web
        run: npx expo export --platform web

      - name: Apply smartphone web layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          index = Path('dist/index.html')
          css = Path('web-mobile.css').read_text(encoding='utf-8')
          marker = '<style id="grafik-pracy-mobile">'
          if index.exists():
              html = index.read_text(encoding='utf-8')
              if marker not in html:
                  html = html.replace('</head>', marker + '\n' + css + '\n</style>\n</head>', 1)
                  index.write_text(html, encoding='utf-8')
          PY

      - name: Prepare Firebase Hosting configuration
        working-directory: .
        run: |
          cat > firebase.json <<'EOF'
          {
            "hosting": {
              "public": "GrafikPracy_Final/dist",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**"
              ],
              "cleanUrls": true
            }
          }
          EOF

      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "Brak sekretu FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          node -e "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/firebase-service-account.json','utf8')); console.log('JSON konta serwisowego: OK')"

      - name: Install Firebase CLI
        working-directory: .
        run: npm install -g firebase-tools

      - name: Deploy to Firebase Hosting
        working-directory: .
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: firebase deploy --only hosting --project grafik-pracy-c9006 --non-interactive

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: Grafik-Pracy-Web
          path: GrafikPracy_Final/dist
          if-no-files-found: error
